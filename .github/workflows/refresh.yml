name: Refresh calendar

on:
  push:
    paths:
      - 'data/events.json'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/refresh.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/generate_ics.py --input data/events.json --output docs/resets.ics
      - name: Commit generated calendar when data changed
        run: |
          if git diff --quiet -- docs/resets.ics; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/resets.ics
          git commit -m 'Generate reset calendar'
          git push
